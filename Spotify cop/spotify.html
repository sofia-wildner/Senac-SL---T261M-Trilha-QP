<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Login</title>

    <link rel="stylesheet" href="style.css">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">
        <i class="fa-brands fa-spotify logo"></i>
        <h1>Olá de novo</h1>
        <form>
            <label>E-mail</label>
            <input type="email">

            <button class="continuar">Continuar</button>

        </form>

        <div class="linha">
            <span>ou</span>
        </div>
        </button>

        <button class="social">
            <i class="fa-solid fa-mobile-screen"></i>
            <p> com o número de
            telefone
            </p>
        </button>
        
        <button class="social">
            <i class="fa-brands fa-facebook"></i>
            Continuar com o Facebook
        </button>

        <button class="social">
            <i class="fa-brands fa-google"></i>
            Continuar com o Google
        </button>

        <button class="social">
            <i class="fa-brands fa-apple"></i>
            Continuar com a Apple
        </button>

        <p class="conta">Não tem uma conta?
        </p>
        <a href="#">Inscrever-se</a>

        <p class="rodape">
            Este site é protegido pelo reCAPTCHA e está sujeito à Política de
            Privacidade e aos Termos de Serviço do Google.
        </p>

    </div>
</body>

</html>
