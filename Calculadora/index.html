<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator .✦ ݁˖</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="calculadora.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Caixa da calculadora -->
    <div class="calculadora">

        <h1>Calculator 2000's</h1>

        <!-- Visor -->
        <div id="calculator">
            <output class="result">0</output>
        </div>

        <!-- Números e operador -->
        <div class="op">

            <input type="number" id="firstNumber">

            <span id="simbolo">+</span>

            <input type="number" id="secondNumber">

        </div>

        <!-- Botões das operações -->
        <div class="operacoes">

            <button class="operador" value="+">+</button>

            <button class="operador" value="-">−</button>

            <button class="operador" value="*">×</button>

            <button class="operador" value="/">÷</button>

        </div>

        <!-- Botões principais -->
        <button id="calculate">Calculate</button>
        <button id="clear">Limpar</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
